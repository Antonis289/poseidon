name: OTA Update (optional — requires EAS setup)

# Pushes a silent JS bundle update to installed apps via EAS Update.
# Requires EXPO_TOKEN to be set as a repository secret AND eas init
# to have been run. Skip this workflow if you haven't set up EAS.

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Update description'
        required: false
        default: 'Content and UI update'
      channel:
        description: 'Channel'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview

jobs:
  update:
    name: Publish OTA Update
    runs-on: ubuntu-latest
    if: ${{ vars.EAS_ENABLED == 'true' }}   # Set this repo variable to enable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Publish update
        working-directory: mobile
        run: |
          eas update \
            --channel "${{ inputs.channel }}" \
            --message "${{ inputs.message }}" \
            --non-interactive
