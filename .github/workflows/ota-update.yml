name: OTA Update (Push JS bundle to devices)

# Pushes a silent over-the-air update to all installed apps.
# No reinstall needed — the app picks up changes on next launch.
# Only works for JS/asset changes. Native code changes require a new APK build.

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/src/**'
      - 'mobile/assets/**'
      - 'mobile/App.js'
  workflow_dispatch:
    inputs:
      message:
        description: 'Update description shown in EAS dashboard'
        required: false
        default: 'Content and UI update'
      channel:
        description: 'Update channel'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview

jobs:
  update:
    name: Publish OTA Update
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Publish OTA update
        working-directory: mobile
        run: |
          UPDATE_MSG="${{ inputs.message }}"
          if [ -z "$UPDATE_MSG" ]; then
            UPDATE_MSG="$(echo '${{ github.event.head_commit.message }}' | head -1)"
          fi

          CHANNEL="${{ inputs.channel }}"
          if [ -z "$CHANNEL" ]; then
            CHANNEL="production"
          fi

          eas update \
            --channel "$CHANNEL" \
            --message "$UPDATE_MSG" \
            --non-interactive

      - name: Summary
        run: |
          echo "### OTA Update Published" >> $GITHUB_STEP_SUMMARY
          echo "Channel: **${{ inputs.channel || 'production' }}**" >> $GITHUB_STEP_SUMMARY
          echo "Installed apps will update silently on next launch." >> $GITHUB_STEP_SUMMARY
