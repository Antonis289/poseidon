name: Deploy Web App (PWA)

# Builds the Expo web app and deploys it to GitHub Pages.
# The result is a Progressive Web App — open the URL on your phone,
# tap "Add to Home Screen", and it installs like a native app.
# No Expo account or secrets needed — only the built-in GITHUB_TOKEN.

on:
  push:
    branches:
      - main
      - 'claude/*'
    paths:
      - 'mobile/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

# Required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Web Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Patch app.json for web build
        run: |
          UUID=$(cat /proc/sys/kernel/random/uuid)
          sed -i "s/YOUR_PROJECT_ID/$UUID/g" mobile/app.json

      - name: Build web bundle
        working-directory: mobile
        env:
          EXPO_NO_TELEMETRY: 1
          CI: 1
        run: npx expo export --platform web

      - name: Add .nojekyll (required for GitHub Pages)
        run: touch mobile/dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
